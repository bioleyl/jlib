name: Publish to npm

# Pushing a version tag (v0.1.3) stages that version on npm and creates its GitHub release; a maintainer then
# approves the staged version (npm stage approve, with 2FA) to make it public. No npm token: npm trusts this
# workflow (trusted publishing, set in the package's npm settings) and adds a provenance statement. A version
# already on npm is not staged again: its release gets npm's own tarball.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@latest
      - run: npm ci

      - name: Check that the tag is the package's version
        id: package
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag is $GITHUB_REF_NAME but package.json says $version."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Is this version on npm already?
        id: npm
        env:
          SPEC: ${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}
        run: |
          if npm view "$SPEC" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check
        if: steps.npm.outputs.published == 'false'
        run: npm run check

      # The tarball attached to the release: built here (prepack builds the library), or npm's own when it exists.
      - name: Pack
        env:
          PUBLISHED: ${{ steps.npm.outputs.published }}
          SPEC: ${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}
        run: |
          if [ "$PUBLISHED" = "true" ]; then
            npm pack "$SPEC"
          else
            npm pack
          fi

      # The trusted publisher may only stage (npm's recommended setting): the version waits on npm, hidden, until a
      # maintainer approves it with their two-factor authentication. npm's error, on failure, becomes an annotation.
      - name: Stage on npm
        if: steps.npm.outputs.published == 'false'
        env:
          NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if ! npm stage publish ./*.tgz > stage.log 2> stage-errors.log; then
            cat stage.log stage-errors.log
            echo "::error title=npm stage publish failed::$(grep -E 'npm (error|ERR)' stage-errors.log | head -12 | tr '\n' ' ')"
            exit 1
          fi
          cat stage.log stage-errors.log
          {
            echo "## $NAME@$VERSION is staged on npm"
            echo
            echo "It becomes public once a maintainer approves it, with their two-factor authentication:"
            echo
            echo '```'
            echo "npm stage list $NAME"
            echo "npm stage approve <stage-id>"
            echo '```'
            echo
            echo "What npm answered:"
            echo
            echo '```'
            cat stage.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Staged on npm::$NAME@$VERSION waits for approval: npm stage list $NAME, then npm stage approve <stage-id>."

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME exists already."
            exit 0
          fi
          notes="Install it with \`npm install $NAME@$VERSION\`: [npm](https://www.npmjs.com/package/$NAME/v/$VERSION) · [documentation](https://bioleyl.github.io/jlib/)"
          gh release create "$GITHUB_REF_NAME" ./*.tgz --title "$GITHUB_REF_NAME" --notes "$notes" --generate-notes
