name: Publish to npm

# Started by hand for a version's tag (v0.1.3), from the Actions tab or `gh workflow run publish.yml -f tag=v0.1.3`:
# it stages that version on npm and creates its GitHub release; a maintainer then approves the staged version
# (npm stage approve, with 2FA) to make it public. Pushing a tag starts nothing. No npm token: npm trusts this
# workflow (trusted publishing, set in the package's npm settings) and adds a provenance statement. A version
# already on npm is not staged again: its release gets npm's own tarball.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The version's tag, pushed already: v0.1.3"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      # The input reaches the shell through the environment only, never written into a script.
      - name: Check the tag's form
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Not a version tag::$TAG is not a version's tag, such as v0.1.3."
            exit 1
          fi

      # The tag itself, not a branch of that name: the release is what the tag points at.
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@latest
      - run: npm ci

      - name: Check that the tag is the package's version
        id: package
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "The tag is $TAG but package.json says $version."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Is this version on npm already?
        id: npm
        env:
          SPEC: ${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}
        run: |
          if npm view "$SPEC" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check
        if: steps.npm.outputs.published == 'false'
        run: npm run check

      # The tarball attached to the release: built here (prepack builds the library), or npm's own when it exists.
      - name: Pack
        env:
          PUBLISHED: ${{ steps.npm.outputs.published }}
          SPEC: ${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}
        run: |
          if [ "$PUBLISHED" = "true" ]; then
            npm pack "$SPEC"
          else
            npm pack
          fi

      # The trusted publisher may only stage (npm's recommended setting): the version waits on npm, hidden, until a
      # maintainer approves it with their two-factor authentication. npm's error, on failure, becomes an annotation.
      - name: Stage on npm
        if: steps.npm.outputs.published == 'false'
        env:
          NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          # A pre-release (0.2.0-beta.1) goes under the next tag: npm keeps latest for stable versions.
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          if ! npm stage publish ./*.tgz --tag "$tag" > stage.log 2> stage-errors.log; then
            cat stage.log stage-errors.log
            echo "::error title=npm stage publish failed::$(grep -E 'npm (error|ERR)' stage-errors.log | head -12 | tr '\n' ' ')"
            exit 1
          fi
          cat stage.log stage-errors.log
          {
            echo "## $NAME@$VERSION is staged on npm"
            echo
            echo "It becomes public once a maintainer approves it, with their two-factor authentication:"
            echo
            echo '```'
            echo "npm stage list $NAME"
            echo "npm stage approve <stage-id>"
            echo '```'
            echo
            echo "What npm answered:"
            echo
            echo '```'
            cat stage.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Staged on npm::$NAME@$VERSION waits for approval: npm stage list $NAME, then npm stage approve <stage-id>."

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "The release $TAG exists already."
            exit 0
          fi
          notes="Install it with \`npm install $NAME@$VERSION\`: [npm](https://www.npmjs.com/package/$NAME/v/$VERSION) · [documentation](https://bioleyl.github.io/jlib/)"
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" ./*.tgz --title "$TAG" --notes "$notes" --generate-notes "${prerelease[@]}"
